<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}LUX QR SYSTEM{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#20252b}
header{background:#101827;color:white;padding:28px 18px;text-align:center}
header h1{margin:0;font-size:30px}header p{margin:8px 0 0;color:#d8dee9}
nav{background:#fff;padding:12px;text-align:center;border-bottom:1px solid #ddd}
nav a{margin:0 10px;text-decoration:none;color:#1757b8;font-weight:bold}
main{max-width:1200px;margin:24px auto;padding:0 15px}
.card{background:white;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 2px 12px #00000010}
h2{margin-top:0}.notice{padding:14px;border-radius:10px;margin-bottom:10px}.success{background:#e7f7ec;color:#176b35}.danger{background:#fde8e8;color:#9b1c1c}
input[type=file]{padding:12px;border:1px dashed #888;width:100%;margin:10px 0}
button,.btn{background:#1769e0;color:#fff;border:0;border-radius:8px;padding:11px 17px;cursor:pointer;text-decoration:none;display:inline-block}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{background:#eef3f8}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.qr-card{text-align:center;border:1px solid #ddd;border-radius:12px;padding:16px;background:#fff}
.qr-card img{width:190px;height:190px;object-fit:contain}
.badge{padding:4px 8px;border-radius:12px;background:#eee;font-size:12px}
@media(max-width:700px){header h1{font-size:24px}table{font-size:12px}th,td{padding:7px}}
</style>
</head>
<body>
<header><h1>💡 LUX QR SYSTEM</h1><p>Permanent QR • Monthly Excel Updates • Complete History</p></header>
<nav>
<a href="{{ url_for('admin') }}">Admin</a>
<a href="{{ url_for('qr_codes') }}">View / Print QR Codes</a>
<a href="{{ url_for('history') }}">Monthly History</a>
</nav>
<main>
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}
<div class="notice {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
